spring.application.name=vulkanIA
server.port=8080

# 1. Conexión a MySQL de XAMPP (puerto 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/vulkania_gas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate / JPA (crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Eureka Server (evita que intente registrarse a sí mismo y tire error)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/

# 4. Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html


# 5. JWT (definir JWT_SECRET como variable de entorno; minimo 32 caracteres)
jwt.secret=${JWT_SECRET:VulkaniaGasClaveSecretaSuperSegura2026-solo-desarrollo}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
