spring.application.name=vulkanIA
server.port=8080

# 1. Conexión a MySQL de XAMPP (puerto 3306 y BD vulkania_gas_db)
spring.datasource.url=jdbc:mysql://localhost:3306/vulkania_gas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Eureka Server (evita que intente registrarse a sí mismo y tire error)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/

# 4. Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html